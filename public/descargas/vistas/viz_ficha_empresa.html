<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de empresa · Segona Volta (ejemplo imaginado)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;700&display=swap">
<style>
  /* Colores de la empresa: los mismos que en estilo.md */
  :root { --tinta: #17212b; --azul: #0057b8; --senal: #ffc400; --gris: #e6ebf0; --blanco: #fff; }

  /* 1rem = 16px cuando la vista mide 1280x720; crece y mengua con el marco */
  html { font-size: min(1.25vw, 2.2222vh); }
  * { box-sizing: border-box; margin: 0; }
  body { font: 400 1.4rem/1.35 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; color: var(--tinta);
         background: var(--blanco); height: 100vh; overflow: hidden; display: grid; place-items: center; }
  .ficha { width: 80rem; height: 45rem; display: grid; grid-template-columns: 24rem 1fr; }

  /* ---------- Columna fija: el nombre y la rueda ---------- */
  .placa { background: var(--azul); color: var(--blanco); padding: 2.4rem 2rem 2rem; display: flex; flex-direction: column; }
  .placa h1 { font-size: 4.2rem; line-height: .95; font-weight: 700; }
  .placa p { margin-top: 1rem; font-size: 1.5rem; }
  .placa .nota { font-size: 1rem; margin-top: auto; }
  .rueda { width: 18rem; align-self: center; margin-top: 2rem; overflow: visible; }
  .rueda g { transform-origin: 0 0; transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
  .rueda line, .rueda circle { fill: none; stroke: var(--blanco); stroke-width: 2; }
  .rueda .cubierta { stroke-width: 9; }
  .rueda .valvula { stroke: var(--senal); stroke-width: 6; }

  /* ---------- Datos ---------- */
  .zona { padding: 2rem 2.6rem; display: grid; grid-template-rows: auto 1fr; gap: 1.6rem; min-width: 0; }
  .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; align-content: start; }
  .datos button {
    font: inherit; color: inherit; text-align: left; cursor: pointer; border: 0; border-bottom: .15rem solid var(--tinta);
    padding: 1rem .8rem; min-height: 6.6rem;
    background: linear-gradient(var(--senal), var(--senal)) no-repeat 0 0 / 0% 100%; transition: background-size .4s;
  }
  .datos button:hover { background-color: var(--gris); }
  .datos button[aria-pressed="true"] { background-size: 100% 100%; }
  .datos button:focus-visible { outline: .25rem solid var(--azul); outline-offset: -.25rem; }
  .datos span { display: block; font-size: 1.25rem; }
  .datos strong { display: block; font-size: 1.7rem; line-height: 1.15; }

  .explica { font-size: 1.7rem; max-width: 34rem; min-height: 7rem; }
  .explica.entra { animation: entra .45s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateX(2rem); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>
<main class="ficha">
  <header class="placa">
    <h1 id="nombre"></h1>
    <p id="lema"></p>
    <svg class="rueda" viewBox="-60 -60 120 120" aria-hidden="true">
      <g id="rueda"><circle class="cubierta" r="52"/><circle r="7"/><line class="valvula" y1="-46" y2="-34"/></g>
    </svg>
    <p class="nota">Ejemplo imaginado. Los datos no son de una empresa real.</p>
  </header>
  <div class="zona">
    <div class="datos" id="datos"></div>
    <p class="explica" id="explica" aria-live="polite"></p>
  </div>
</main>

<script>
  /* ----- Datos: lo que cambia de una empresa a otra ----- */
  var NOMBRE = 'Segona Volta';
  var LEMA = 'Arreglamos tu bici mientras estás en clase.';
  /* etiqueta, valor, explicación que sale al pulsar */
  var DATOS = [
    ['Actividad', 'Reparación de bicicletas', 'Arreglamos bicicletas de paseo y de montaña. No vendemos bicis nuevas.'],
    ['Forma societaria', 'Sociedad limitada (S. L.)', 'Son dos socias. Han elegido la S. L. porque responden con el dinero que han puesto en la empresa.'],
    ['Dirección', 'Calle Imaginada, 12', 'Un local a la vuelta del instituto. Se llega andando en dos minutos.'],
    ['Localidad', 'València', 'El local está en un barrio con carril bici.'],
    ['Empleados', '5 personas', 'Con menos de 10 personas somos una microempresa.'],
    ['Año de inicio', '2026', 'Empezamos en septiembre, con el curso.'],
    ['Horario', 'De 8:00 a 15:00', 'De lunes a viernes. Es el horario de clase: dejas la bici al entrar y la recoges al salir.'],
    ['Contacto', 'hola@segonavolta.example', 'El correo es inventado. Los que terminan en .example no existen.']
  ];

  var $ = function (id) { return document.getElementById(id); };
  var paso = 360 / DATOS.length;
  $('nombre').textContent = NOMBRE;
  $('lema').textContent = LEMA;

  /* Un radio por dato */
  DATOS.forEach(function (d, i) {
    var r = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    r.setAttribute('y1', -7); r.setAttribute('y2', -47);
    r.setAttribute('transform', 'rotate(' + (i + 0.5) * paso + ')');
    $('rueda').append(r);

    var b = document.createElement('button'), e = document.createElement('span'), v = document.createElement('strong');
    e.textContent = d[0]; v.textContent = d[1];
    b.append(e, v);
    b.addEventListener('click', function () { elegir(i); });
    $('datos').append(b);
  });

  /* Al pulsar un dato, la rueda gira hasta él y sale su explicación */
  function elegir(i) {
    Array.from($('datos').children).forEach(function (b, k) { b.setAttribute('aria-pressed', String(k === i)); });
    $('rueda').style.transform = 'rotate(' + i * paso + 'deg)';
    var t = $('explica');
    t.textContent = DATOS[i][2];
    t.classList.remove('entra');
    void t.offsetWidth;
    t.classList.add('entra');
  }
  elegir(0);
</script>
</body>
</html>
